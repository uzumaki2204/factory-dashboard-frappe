[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "factory_dashboard"
version = "0.1.7"
description = "Factory productivity dashboard for Frappe Desk"
readme = "README.md"
requires-python = ">=3.14"

[tool.bench.frappe-dependencies]
frappe = ">=16.53.0,<17.0.0"
factory_management = ">=0.1.87,<0.2.0"
factory_productivity = ">=0.1.0,<0.2.0"

[tool.setuptools.packages.find]
where = ["."]
include = ["factory_dashboard*"]

[tool.setuptools.package-data]
factory_dashboard = ["*.txt", "*.json", "translations/*.csv", "public/images/*.svg", "public/css/*.css", "public/js/*.js", "www/*.html", "www/*.py", "factory_dashboard/doctype/*/*.json", "factory_dashboard/page/*/*.json", "factory_dashboard/page/*/*.js"]
